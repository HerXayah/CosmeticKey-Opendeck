[package]
name = "opendeck-cosmetickey"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "opendeck-cosmetickey"
path = "src/main.rs"

[dependencies]
openaction = "2.6"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", features = ["gif"] }
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
